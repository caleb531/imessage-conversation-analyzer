[project]
name = "imessage-conversation-analyzer"
version = "3.1.0"
description = "Analyzes the entire history of a macOS Messages conversation"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    {name = "Caleb Evans", email = "caleb@calebevans.me"}
]
maintainers = [
    {name = 'Caleb Evans', email = 'caleb@calebevans.me'}
]
license = "MIT"
keywords = ["apple", "imessage", "messages", "macos", "conversation", "chat", "analysis", "pandas"]
dependencies = [
    "pandas>=2.3.3,<3",
    "pyarrow>=21.0.0,<24",
    "tabulate>=0.9.0,<1",
    "openpyxl>=3.1.5,<4",
    "pytypedstream>=0.1.0,<1",
    "phonenumbers>=9.0.22,<10",
    "tzlocal>=5.3.1,<6",
    "emoji>=2.15.0,<3",
    "duckdb>=1.4.3,<2",
]

[project.urls]
homepage = "https://github.com/caleb531/imessage-conversation-analyzer"
documentation = "https://github.com/caleb531/imessage-conversation-analyzer#readme"
repository = "https://github.com/caleb531/imessage-conversation-analyzer"
changelog = "https://github.com/caleb531/imessage-conversation-analyzer/releases"

[project.scripts]
ica = "ica.__main__:main"

[tool.uv]
required-version = ">=0.13.5,<0.14"

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ica"
module-root = ""

[tool.ruff]
include = ["**/*.py"]

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    "W",
    # pyflakes
    "F",
    # isort
    "I",
    # perflint
    "PERF",
    # flake8-annotations
    "ANN001",
    "ANN201",
]

# Configuration for coverage.py (https://pypi.python.org/pypi/coverage)

[tool.coverage.run]
# Enable branch coverage
branch = true
# Only check coverage for source files
source = ['ica']

[tool.coverage.report]
# Regexes for lines to exclude from consideration
exclude_lines = [
    "pragma: no cover",
    # Ignore non-runnable code
    "if __name__ == .__main__.:",
    "pass",
]

[dependency-groups]
dev = [
    "freezegun>=1.5.5",
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.13",
    "ty>=0.0.12",
]
